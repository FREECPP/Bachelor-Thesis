; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra fields
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[common]
platform = raspberrypi
board = pico
framework = arduino
lib_extra_dirs = ../shared
monitor_speed = 115200
extra_scripts = pre:generate_version.py
lib_deps =
    https://github.com/robotlem/pololu-3pi-plus-2040-arduino-library.git
    pololu/Pushbutton@^2.0.0
    pololu/PololuOLED@^2.0.0
    pololu/OPT3101@^1.0.1
    olikraus/U8g2@^2.36.18

; ----------------------------------------------------------------
; Pololu 3pi+ 2040 Standard Edition (30:1 MP) – Default
;   Bau mit:   pio run -e pico_normal
; ----------------------------------------------------------------
[env:pico_normal]
extends = common
build_flags =
    -D TARGET_RP2040

; ----------------------------------------------------------------
; Pololu 3pi+ 2040 Hyper Edition (15:1 HPCB) – HyperMouse
;   Bau mit:   pio run -e pico_hyper
; Aktiviert in MicromousePlatform.h:
;   - PWM-Skalierung 7/8 (Anlauf-Reserve fuer HPCB-Motoren; kleinere
;     Werte → Cogging → Motor laeuft nicht an)
;   - Zeit-Skalierung 3/7 (gleicher Drehwinkel/Bahn bei hoeherer
;     Geschwindigkeit – Hyper faehrt ~2.33x schneller)
;   - Motor-Drehrichtung beidseitig invertiert (Getriebe rotiert
;     entgegen Pinion – via motors.flipLeftMotor/Right() in
;     mappingSetup()).
; ----------------------------------------------------------------
;[env:pico_hyper]
;extends = common
;build_flags =
;    -D TARGET_RP2040
;    -D MOUSE_HYPER
