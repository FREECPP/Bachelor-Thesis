; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[platformio]
default_envs = xiao_esp32s3


[env:xiao_esp32s3]
platform = espressif32@6.10.0
board = seeed_xiao_esp32s3
framework = arduino
upload_speed = 115200

lib_extra_dirs = ../shared

; Bluepad32 ist KEIN normales lib_dep – es steckt im modifizierten Arduino-ESP32-Core.
; Dieser Workaround ersetzt den Standard-Core durch das Bluepad32-Bundle:
; (Quelle: https://community.platformio.org/t/use-bluepad32-library-in-pio/46745)
platform_packages =
    framework-arduinoespressif32@https://github.com/maxgerhardt/pio-framework-bluepad32/archive/refs/heads/main.zip

monitor_speed = 115200
;monitor_port = /dev/ttyACM2
monitor_filters = esp32_exception_decoder

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DTARGET_SEED

[env:esp32s3_wroom2]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
; Flash-Konfiguration (32 MB Octal Flash)
board_upload.flash_size = 32MB
board_build.flash_mode = opi
board_build.flash_freq = 80m

; PSRAM-Konfiguration (16 MB Octal PSRAM)
board_build.arduino.memory_type = opi_opi
board_build.psram_type = opi


lib_extra_dirs = ../shared

; Bluepad32 ist KEIN normales lib_dep – es steckt im modifizierten Arduino-ESP32-Core.
; Dieser Workaround ersetzt den Standard-Core durch das Bluepad32-Bundle:
; (Quelle: https://community.platformio.org/t/use-bluepad32-library-in-pio/46745)
platform_packages =
    framework-arduinoespressif32@https://github.com/maxgerhardt/pio-framework-bluepad32/archive/refs/heads/main.zip

monitor_speed = 115200
monitor_port = /dev/ttyUSB0
monitor_filters = esp32_exception_decoder

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DTARGET_WROOM2
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0  ; Aktiviert USB-Seriell über den internen USB-Port



